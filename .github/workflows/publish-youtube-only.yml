name: Publish avatar to YouTube only
on: workflow_dispatch
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      APP_URL: https://receiptspack.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/cross-post-youtube.mjs public/videos/avatar-intro.mp4 || echo "youtube skip"
