name: Virality swarm (daily trend hooks)
on:
  schedule: [{cron: "0 5 * * *"}]   # 05:00 UTC — one hour before the daily video run
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: virality-swarm, cancel-in-progress: false}
jobs:
  swarm:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/virality-swarm.mjs
      - name: Tag scout (daily TikTok/IG hashtag refresh)
        run: node scripts/tag-scout.mjs
      - name: Commit trend scripts
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add content/
          git diff --cached --quiet || (git commit -m "Virality swarm: trend-reactive hooks" && git pull --rebase -q && git push -q)
