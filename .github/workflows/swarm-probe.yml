name: swarm source probe (temp)
on: { workflow_dispatch: {} }
permissions: { contents: read, models: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - run: |
          curl -s -i -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"say ok"}],"max_tokens":5}' | sed -E 's/(authorization|cookie)[^\n]*/[hdr]/I' | head -40
          echo; echo "--- catalog"; curl -s https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" | head -c 400; echo
