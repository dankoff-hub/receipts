name: Audience watch (daily)
# Daily audience check across YouTube/TikTok/Instagram + post delivery verification
# + strategy brief for the swarm. Runs after the daily video (06:00 UTC).
on:
  schedule: [{cron: "0 7 * * *"}]
  workflow_dispatch:
permissions: {contents: write, issues: write}
jobs:
  audience:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Channel health (auto-pause banned/disconnected channels, re-probe every 3 days)
        run: node scripts/channel-health.mjs
      - name: Reconcile post-log against Buffer (catches failed/lost posts)
        run: node scripts/check-posts.mjs
      - run: node scripts/audience-watch.mjs
      - name: Per-post metrics from Buffer → strategy-brief.performance + audience scoreboard
        run: node scripts/post-metrics.mjs | tee /tmp/perf.txt
      - name: Growth model (Monte Carlo to $50k by Jan 31) → comment on today's audience issue
        run: |
          python3 scripts/growth-model.py 600 | tee /tmp/model.txt
          ISSUE=$(gh issue list -l audience -L 1 --json number --jq '.[0].number' || true)
          if [ -n "$ISSUE" ]; then printf '### Audience scoreboard\n```\n%s\n```\n### Growth model (daily)\n```\n%s\n```\nLevers A–H run on free infra; I (founder time) and J ($3k creator seeding) need the founder. See content/growth-plan.md.\n' "$(tail -c 1500 /tmp/perf.txt)" "$(cat /tmp/model.txt)" | gh issue comment "$ISSUE" -F -; fi
      - name: Commit audience data
        run: |
          git config user.name dankoff-hub; git config user.email 345066702+dankoff-hub@users.noreply.github.com
          git add content/audience-history.json content/audience-config.json content/strategy-brief.json content/post-log.json content/growth-model.json content/post-metrics.json content/audience-scoreboard.json content/variant-policy.json
          git diff --cached --quiet || { git commit -m "Audience watch: daily stats + strategy brief"; git pull --rebase -q && git push -q; }
