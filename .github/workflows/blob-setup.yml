name: Vercel Blob store setup (subscriber storage, idempotent)
on: { workflow_dispatch: {} }
permissions: { contents: read, actions: write }
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}", GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm i -g vercel@65.11.0 >/dev/null 2>&1
          mkdir -p app && cd app
          timeout 60 vercel link --yes --project receipts --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          if timeout 60 vercel env ls production --token "$VERCEL_TOKEN" 2>/dev/null | grep -q BLOB_READ_WRITE_TOKEN; then echo "BLOB_READ_WRITE_TOKEN already present"; exit 0; fi
          # creates a Blob store and connects it to the linked project (adds BLOB_READ_WRITE_TOKEN env)
          timeout 120 vercel blob store add receipts-subscribers --yes --token "$VERCEL_TOKEN" 2>&1 | sed -E 's/vercel_blob_rw_[A-Za-z0-9_]+/[redacted]/g' | tail -5
          timeout 60 vercel env ls production --token "$VERCEL_TOKEN" 2>/dev/null | grep -q BLOB_READ_WRITE_TOKEN && echo "BLOB_READ_WRITE_TOKEN present" && gh workflow run deploy.yml -R ${{ github.repository }} --ref main && echo "redeploy dispatched"
