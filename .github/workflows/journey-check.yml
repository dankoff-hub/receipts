name: Customer journey check (read-only)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { STRIPE_API_KEY: "${{ secrets.STRIPE_API_KEY }}", APP_URL: https://receipts-blond.vercel.app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/journey-check.mjs
