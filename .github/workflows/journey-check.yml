name: Customer journey check (read-only)
on:
  schedule: [{cron: "30 7 * * *"}]   # daily 07:30 UTC: mobile QA + Stripe/CTA audit; goes red when the journey degrades
  workflow_dispatch:
    inputs:
      prune_test:
        description: delete @example.com test subscribers
        type: boolean
        default: false
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: { STRIPE_API_KEY: "${{ secrets.STRIPE_API_KEY }}", APP_URL: https://receiptspack.vercel.app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/journey-check.mjs
      - name: Mobile journey QA (Playwright, iPhone viewport)
        env: { APP_URL: https://receiptspack.vercel.app }
        run: |
          npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/mobile-qa.mjs
      - name: Subscriber store (count + hashed ids only; token never printed)
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}", PRUNE_TEST: "${{ inputs.prune_test }}" }
        run: |
          npm i -g vercel@65.11.0 >/dev/null 2>&1; npm i @vercel/blob@latest >/dev/null 2>&1
          timeout 60 vercel link --yes --project receipts --token "$VERCEL_TOKEN" >/dev/null 2>&1
          timeout 60 vercel env pull .env.tmp --environment production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1
          set -a; . ./.env.tmp; set +a; rm -f .env.tmp
          node -e '
            const { list, del } = require("@vercel/blob");
            (async () => { const r = await list({ prefix: "subscribers/" }); console.log("subscribers stored:", r.blobs.length);
              for (const b of r.blobs) { const j = await fetch(b.downloadUrl, { headers: { Authorization: "Bearer " + process.env.BLOB_READ_WRITE_TOKEN } }).then(x=>x.json()).catch(()=>({}));
                const test = /@example\.com$/.test(j.email||""); console.log(" -", b.pathname.slice(12,20)+"…", j.src||"?", j.at||"", test?"(test entry)":"");
                if (test && process.env.PRUNE_TEST === "true") { await del(b.url); console.log("   pruned"); } } })().catch(e => { console.log("blob list error:", e.message); });'
