name: Daily TikTok video → Buffer → TikTok
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
permissions: {contents: write, issues: write}
concurrency: {group: daily-tiktok, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      APP_URL: https://receipts-blond.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core >/dev/null && pip install -q edge-tts
      - id: day
        run: echo "n=$(( ( $(date +%s) - $(date -d 2026-11-04 +%s) ) / 86400 ))" >> $GITHUB_OUTPUT
      - run: python3 scripts/make-video.py ${{ steps.day.outputs.n }} public/videos/day-$(printf %03d $(( ${{ steps.day.outputs.n }} + 1 ))).mp4
      - name: Commit video (Vercel hosts it)
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add public/videos && git commit -m "Daily video day $(( ${{ steps.day.outputs.n }} + 1 ))" && git push
      - name: Wait for Vercel deploy then schedule in Buffer
        run: node scripts/publish-buffer.mjs public/videos/day-$(printf %03d $(( ${{ steps.day.outputs.n }} + 1 ))).mp4
      - name: Daily brief issue
        run: node scripts/daily-brief.mjs
