name: Daily videos (4 slots) + IG carousel + photo → TikTok + Instagram + YouTube
# Four slots per day: 08/12/16/20 UTC (a/b/c/d). Each slot generates one new video
# (unique script, per-channel captions) and posts the OLDEST not-yet-posted video to every
# channel — max 1 per channel per run; daily caps: TikTok 2 (Buffer free), Instagram 4, YouTube 4.
# Volume is the first lever in scripts/growth-model.py (see content/growth-model.json).
# A cancelled/failed run self-heals: its videos stay pending and go out next slot.
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "a, b, c or d (default: by time of day)"
        default: ""
      channels:
        description: "comma list to restrict publishing, e.g. tiktok (default: all)"
        default: ""
permissions: {contents: write, issues: write, actions: write}
concurrency: {group: daily-videos, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      APP_URL: https://receipts-blond.vercel.app
      ONLY_CHANNELS: ${{ inputs.channels }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      SWARM_WORKER_URL: ${{ vars.SWARM_WORKER_URL }}
      SWARM_KEY: ${{ secrets.SWARM_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: System deps (bounded; apt can hang on fresh runner images)
        timeout-minutes: 6
        run: |
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          for i in 1 2 3; do sudo timeout 150 apt-get update -qq && break; sleep 10; done
          sudo DEBIAN_FRONTEND=noninteractive timeout 200 apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core >/dev/null
          timeout 120 pip install -q edge-tts
      - id: day
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          H=$(date -u +%H)
          if [ -z "$SLOT" ]; then if [ "$H" -lt 10 ]; then SLOT=a; elif [ "$H" -lt 14 ]; then SLOT=b; elif [ "$H" -lt 18 ]; then SLOT=c; else SLOT=d; fi; fi
          case "$SLOT" in am) SLOT=a;; pm) SLOT=b;; esac
          N=$(( ( $(date +%s) - $(date -d 2026-11-03 +%s) ) / 86400 ))
          case "$SLOT" in a) S=0; SUF="";; b) S=1; SUF=b;; c) S=2; SUF=c;; *) S=3; SUF=d;; esac
          F="public/videos/day-$(printf %03d $(( N + 1 )))${SUF}.mp4"
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "idx=$(( N * 4 + S ))" >> $GITHUB_OUTPUT
          echo "label=$(( N + 1 ))" >> $GITHUB_OUTPUT
          echo "f=$F" >> $GITHUB_OUTPUT
          if [ -f "$F" ]; then echo "new=false" >> $GITHUB_OUTPUT; else echo "new=true" >> $GITHUB_OUTPUT; fi
      - if: steps.day.outputs.new == 'true'
        name: Generate video (never-repeated script)
        run: python3 scripts/make-video.py ${{ steps.day.outputs.idx }} ${{ steps.day.outputs.f }} ${{ steps.day.outputs.label }}
      - if: steps.day.outputs.new == 'true'
        name: Caption studio (unique per-channel captions, never repeated)
        run: node scripts/caption-studio.mjs ${{ steps.day.outputs.f }}
      - if: steps.day.outputs.slot == 'b'
        name: Instagram carousel (slot b only; next unused script, 6 slides, unique caption)
        run: |
          pip install -q pillow
          C="public/carousels/car-$(printf %03d ${{ steps.day.outputs.label }})"
          echo "car=$C" >> $GITHUB_ENV
          [ -f "$C.json" ] || python3 scripts/make-carousel.py ${{ steps.day.outputs.idx }} car-$(printf %03d ${{ steps.day.outputs.label }}) ${{ steps.day.outputs.label }}
      - name: Commit video + ledgers
        run: |
          git config user.name dankoff-hub; git config user.email 345066702+dankoff-hub@users.noreply.github.com
          git add public/videos public/carousels content/caption-ledger.json content/script-ledger.json
          git diff --cached --quiet || git commit -m "Daily video ${{ steps.day.outputs.slot }} (day ${{ steps.day.outputs.label }})"
          git pull --rebase -q && git push -q
      - name: Deploy (dispatch the proven deploy workflow; no in-job Vercel CLI to hang)
        run: gh workflow run deploy.yml --ref main
      - name: Publish oldest pending video to TikTok (cap 2/day), Instagram (4), YouTube (4)
        run: node scripts/publish-pending.mjs
      - if: steps.day.outputs.slot == 'c' || inputs.channels == 'photo'
        name: Instagram lifestyle photo (slot c only; 1/day from content/photo-queue.json)
        run: |
          pip install -q pillow 2>/dev/null || true
          node scripts/make-ai-photo.mjs || true
          if git status --porcelain public/photos content/ai-photo-queue.json content/photo-captions.json | grep -q .; then
            git add public/photos content/ai-photo-queue.json content/photo-captions.json && git commit -qm "AI photo $(date -u +%F) [skip ci]" && git push -q || (git pull -q --rebase && git push -q) || true
            echo "waiting for Vercel to serve the new photo"; sleep 90
          fi
          node scripts/post-photo.mjs || true
      - if: steps.day.outputs.slot == 'b' && env.car != ''
        name: Post carousel to Instagram (1/day)
        run: |
          if grep -q "\"video\": \"$(basename $car)\"" content/post-log.json && grep -q "\"status\": \"sent\"" content/post-log.json && node -e "const l=require('./content/post-log.json');process.exit(l.some(p=>p.video==='$(basename $car)'&&p.status==='sent')?0:1)"; then echo "carousel already posted"; else node scripts/post-carousel.mjs "$car" || true; fi
      - name: Commit post log
        if: always()
        run: |
          git config user.name dankoff-hub; git config user.email 345066702+dankoff-hub@users.noreply.github.com
          git add content/post-log.json content/caption-ledger.json public/videos public/photos
          git diff --cached --quiet || { git commit -m "Post log (${{ steps.day.outputs.slot }})"; git pull --rebase --autostash -q && git push -q; }
      - if: steps.day.outputs.slot == 'a'
        name: Daily brief issue
        run: node scripts/daily-brief.mjs
      - if: github.event_name == 'workflow_dispatch' && github.event.inputs.slot == ''
        name: Manual publish via queue (legacy)
        run: |
          if [ -f state/publish-queue.json ] && grep -q '"when": *"now"' state/publish-queue.json; then node scripts/buffer-poster.js; fi
