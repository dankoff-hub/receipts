name: Daily TikTok video → Buffer → TikTok
on:
  schedule: [{cron: "0 6,10,14,18 * * *"}]
  workflow_dispatch:
permissions: {contents: write, issues: write}
concurrency: {group: daily-tiktok, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      APP_URL: https://receipts-blond.vercel.app
      SKOOL_COOKIES: ${{ secrets.SKOOL_COOKIES }}
      SKOOL_GROUP: ${{ vars.SKOOL_GROUP }}
      SKOOL_LABEL_ID: ${{ vars.SKOOL_LABEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core >/dev/null && pip install -q edge-tts
      - id: day
        run: |
          N=$(( ( $(date +%s) - $(date -d 2026-11-03 +%s) ) / 86400 ))
          F="public/videos/day-$(printf %03d $(( N + 1 ))).mp4"
          echo "n=$N" >> $GITHUB_OUTPUT
          echo "f=$F" >> $GITHUB_OUTPUT
          if [ -f "$F" ]; then echo "new=false" >> $GITHUB_OUTPUT; else echo "new=true" >> $GITHUB_OUTPUT; fi
      - if: steps.day.outputs.new == 'true'
        run: python3 scripts/make-video.py ${{ steps.day.outputs.n }} ${{ steps.day.outputs.f }}
      - if: steps.day.outputs.new == 'true'
        name: Commit video (Vercel hosts it)
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add public/videos && git commit -m "Daily video day $(( ${{ steps.day.outputs.n }} + 1 ))"
          git pull --rebase -q && git push -q
      - if: steps.day.outputs.new == 'true'
        name: Wait for Vercel deploy then schedule in Buffer
        run: node scripts/publish-buffer.mjs ${{ steps.day.outputs.f }}
      - if: github.event_name == 'workflow_dispatch'
        name: Manual publish via queue
        run: |
          if [ -f state/publish-queue.json ] && grep -q '"when": *"now"' state/publish-queue.json; then
            node scripts/buffer-poster.js
          fi
      - name: Daily brief issue
        run: node scripts/daily-brief.mjs
      - if: steps.day.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        name: Cross-post to Instagram Reels
        run: node scripts/cross-post-instagram.mjs ${{ steps.day.outputs.f }} || echo "instagram skip"
      - if: steps.day.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        name: Post to Skool community
        run: node scripts/skool-post.mjs ${{ steps.day.outputs.n }} || echo "skool skip"
