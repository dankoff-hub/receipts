name: blob put test
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm i -g vercel@65.11.0 >/dev/null 2>&1; npm i @vercel/blob@latest >/dev/null 2>&1
          timeout 60 vercel link --yes --project receipts --token "$VERCEL_TOKEN" >/dev/null 2>&1
          timeout 60 vercel env pull .env.tmp --environment production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1
          set -a; . ./.env.tmp; set +a; rm -f .env.tmp
          node -e '
            const { put, list, del } = require("@vercel/blob");
            (async () => {
              for (const opts of [{ access: "private", addRandomSuffix: false, allowOverwrite: true, contentType: "application/json" }, { access: "public", addRandomSuffix: false, allowOverwrite: true, contentType: "application/json" }]) {
                try { const r = await put("subscribers/_probe.json", "{}", opts); console.log("put ok", opts.access, r.pathname); await del(r.url); } catch (e) { console.log("put FAILED", opts.access, e.name, e.message); } }
            })();'
