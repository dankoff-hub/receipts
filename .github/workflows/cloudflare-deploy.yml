name: Cloudflare Worker deploy (receipts-swarm, Free plan)
on:
  push: { branches: [main], paths: ["cloudflare/**", ".github/workflows/cloudflare-deploy.yml"] }
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: cf-deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Ensure workers.dev subdomain + KV namespace (idempotent, REST)
        working-directory: cloudflare
        run: |
          A="Authorization: Bearer $CLOUDFLARE_API_TOKEN"; API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          SUB=$(curl -s -H "$A" $API/workers/subdomain | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then curl -s -H "$A" -H 'content-type: application/json' -X PUT $API/workers/subdomain -d '{"subdomain":"receipts-swarm"}' | jq -c '{success, errors}'; SUB=$(curl -s -H "$A" $API/workers/subdomain | jq -r '.result.subdomain // empty'); fi
          echo "workers.dev subdomain: $SUB"; echo "SUB=$SUB" >> $GITHUB_ENV
          KV=$(curl -s -H "$A" "$API/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title=="SWARM_KV") | .id')
          if [ -z "$KV" ]; then KV=$(curl -s -H "$A" -H 'content-type: application/json' -X POST $API/storage/kv/namespaces -d '{"title":"SWARM_KV"}' | jq -r '.result.id'); echo "created KV"; fi
          echo "KV id len ${#KV}"; sed -i "s/__KV_ID__/$KV/" wrangler.toml
      - name: Deploy with wrangler
        working-directory: cloudflare
        run: |
          npx --yes wrangler@4 deploy 2>&1 | grep -vi "token" | tail -8
          # SWARM_KEY secret for the manual /scan endpoint (random, never printed)
          head -c 24 /dev/urandom | base64 | tr -d '/+=' | npx --yes wrangler@4 secret put SWARM_KEY >/dev/null 2>&1 && echo "SWARM_KEY set"
      - name: Smoke test
        run: |
          sleep 8; curl -s -o /tmp/h -w "health %{http_code}\n" "https://receipts-swarm.$SUB.workers.dev/health"; head -c 300 /tmp/h; echo
